short_bio: >-
  <p>
    A <a href="https://en.wikipedia.org/wiki/Bicolor_cat" target="_blank">bicolor cat</a> is a cat with white fur combined with fur of some other colour, for example solid black, tabby, or colourpointed.
  </p>
  <p>
    There exist a wide range of physics problems related to self-organization in biophysics. Using theoretical approaches 
    and computational simulations, I am interested in the underlying mechanisms that govern how complex structures and behaviors 
    emerge in biological systems.
  </p>

